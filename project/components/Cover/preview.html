<!-- @dsCard height=320 -->
<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 960px; height: 320px; background: var(--color-background-body); overflow: hidden; }
  .accent { fill: var(--color-accent); }
  .peak { fill: var(--color-warning); }
  .tint { fill: var(--color-accent-muted); }
  .alert { fill: var(--color-background-error-inverted); }
  .plus { fill: var(--color-on-accent); }
  .name { fill: var(--color-text-primary); font-family: var(--font-display); font-weight: 900; }
  .tagline { fill: var(--color-text-secondary); font-family: var(--font-mono); letter-spacing: 0.08em; }
</style>
</head>
<body>
<!--
  blocks: color-accent slab 240x320 bleeding top and bottom · color-warning 238x136 bleeding top/right ·
    color-accent-muted 238x112 · color-background-error-inverted 72x68 (the one state hue, kept small)
  arrangement: a ramp strip read sideways — blocks butt at the 2px NERV seam (space-0-5), all square (radius-none)
  pattern: plus grid — "precise instrumentation, mono, 4px grid" (README: hairlines, not heavy borders);
    30 crosshairs at a 32px pitch (space-8), 1px arms (border-width), cut from the slab in color-on-accent
  scale: space-0-5 seams, space-8 pitch, space-12 left inset, radius-none corners
-->
