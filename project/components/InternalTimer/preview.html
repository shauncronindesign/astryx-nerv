<!-- @dsCard group="Data display" height=440 subtitle="RESTLAUFZEIT · EVA-02 internal power countdown, German locale · brick + amber housing · Asuka" -->
<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; }
  body { background: #000; font-family: var(--font-sans); padding: var(--space-6); }
  .it { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 250px; grid-template-rows: auto 1fr auto; gap: var(--space-2) var(--space-3);
    width: 900px; padding: var(--space-4) var(--space-5); color: var(--de-amber);
    background: linear-gradient(100deg, var(--de-plum) 0%, #241210 55%, var(--de-brick) 130%);
    clip-path: polygon(0 0, calc(100% - var(--chamfer-lg)) 0, 100% var(--chamfer-lg), 100% 100%, var(--chamfer-lg) 100%, 0 calc(100% - var(--chamfer-lg))); }
  .head { grid-column: 1; display: flex; align-items: baseline; gap: var(--space-3); }
  .head b { margin-right: -40px; font-size: 30px; font-weight: 700; letter-spacing: 0.01em; transform: scaleX(.8); transform-origin: left; color: #e6b866; text-shadow: var(--shadow-bloom); }
  .head span { font: 13px var(--font-mono); opacity: .8; margin-left: -64px; }
  .digits { grid-column: 1; grid-row: 2; display: flex; align-items: flex-end; gap: 8px; transform: skewX(-6deg); padding-left: var(--space-4); }
  .tm { font: 700 34px var(--font-sans); color: var(--de-amber); align-self: center; margin-right: 6px; text-shadow: var(--shadow-bloom); }
  #digits { display: flex; align-items: flex-end; gap: 4px; }
  .digits svg { height: 150px; width: auto; overflow: visible; }
  .seg, .colon { fill: var(--de-amber); filter: drop-shadow(0 0 6px #c8963caa); }
  .off { fill: var(--de-amber); opacity: 0.07; }
  .tabs { grid-column: 2; grid-row: 1 / 3; display: flex; flex-direction: column; gap: 6px; }
  .tab { padding: 8px 12px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); line-height: 1.05; }
  .tab b { display: block; font-size: 30px; font-weight: 700; transform: scaleX(.78); transform-origin: left; }
  .tab span { display: block; font-size: 12px; font-weight: 700; transform: scaleX(.85); transform-origin: left; white-space: nowrap; }
  .tab.int { background: var(--de-brick); color: #f0a088; outline: 1px solid #c8302a; outline-offset: -1px; }
  .tab.int b { color: var(--de-red); text-shadow: 0 0 8px #c8302a88; }
  .tab.int { position: relative; }
  .tab.int::after { content: ""; position: absolute; right: 22px; top: 8px; width: 50px; height: 40px; background: repeating-linear-gradient(-55deg, var(--de-red) 0 6px, transparent 6px 12px); opacity: .8; }
  .tab.sys { background: #2a1512; color: #e6c9a0; border-left: 3px solid var(--de-amber); }
  .tab.sys b { font-size: 19px; }
  .tab.ext { background: #8a5a22; color: #2a1510; }
  .tab.ext b { opacity: .55; }
  .modes { grid-column: 1 / 3; display: grid; grid-template-columns: repeat(4, 1fr) 1.2fr; gap: 4px; }
  .mode { height: 32px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; letter-spacing: .04em;
    background: #3a1c14; color: #c8963c; border-top: 2px solid #7a4a24; transform: skewX(-8deg); }
  .mode::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #7a4a24; margin-right: 8px; }
  .mode.on::before { background: #2a1510; } .mode.fast::before { background: var(--de-red); box-shadow: 0 0 6px var(--de-red); } .mode.blank::before { display: none; }
  .it::before { content: ""; position: absolute; inset: 6px; border: 1px solid #7a4a2466; pointer-events: none; clip-path: inherit; }
  .it::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 55%, #c8963c22, transparent 60%); pointer-events: none; }
  .mode.on { background: var(--de-amber); color: #2a1510; }
  .mode.fast { background: #4a1410; color: #ff8a70; border-top-color: var(--de-red); }
  .mode.fast.on { background: var(--de-red); color: #fff; text-shadow: var(--shadow-bloom); }
  .mode.blank { background: #2a1512; border-top-color: #3a1c14; }
</style>
</head>
<body>
  <div class="it" role="timer" aria-label="Restlaufzeit, time remaining">
    <div class="head"><b>RESTLAUFZEIT:</b></div>
    <div class="digits" aria-live="off"><span class="tm">T-</span><span id="digits"></span></div>
    <div class="tabs">
      <div class="tab int"><b>INTERN</b><span>ENERGIEVERSORGUNG</span></div>
      <div class="tab sys"><b>HAUPTENERGIE-<br>VERSORGUNGSSYSTEM</b><span>MAIN ENERGY SUPPLY</span></div>
      <div class="tab ext"><b>EXTERN</b><span>ENERGIEVERSORGUNG</span></div>
    </div>
    <div class="modes" id="modes"><div class="mode">STOP</div><div class="mode on">NORMAL</div><div class="mode">LANGSAM</div><div class="mode fast">SCHNELL</div><div class="mode blank"></div></div>
  </div>
<script>
const MAP = { 0:"abcdef",1:"bc",2:"abged",3:"abgcd",4:"fgbc",5:"afgcd",6:"afgedc",7:"abc",8:"abcdefg",9:"abcfgd" };
const S = { a:"9,3 51,3 41,15 19,15", b:"53,5 53,48 43,42 43,17", c:"53,52 53,95 43,83 43,58", d:"9,97 51,97 41,85 19,85",
            e:"7,52 7,95 17,83 17,58", f:"7,5 7,48 17,42 17,17", g:"10,50 19,43 41,43 50,50 41,57 19,57" };
const digit = n => `<svg viewBox="0 0 60 100" aria-hidden="true">${Object.entries(S).map(([k,p])=>`<polygon points="${p}" class="${MAP[n].includes(k)?"seg":"off"}"/>`).join("")}</svg>`;
const colon = `<svg viewBox="0 0 16 100" aria-hidden="true"><rect class="colon" x="4" y="30" width="8" height="10"/><rect class="colon" x="4" y="64" width="8" height="10"/></svg>`;
const el = document.getElementById("digits"), modes = [...document.querySelectorAll(".mode")];
let left = 179990, last = 0; // 2:59:99
function draw(){ const m = Math.floor(left/60000), s = Math.floor(left/1000)%60, c = Math.floor(left/10)%100;
  el.innerHTML = digit(m) + colon + digit(Math.floor(s/10)) + digit(s%10) + colon + digit(Math.floor(c/10)) + digit(c%10);
  el.closest('.it').setAttribute("aria-label", `Restlaufzeit ${m} Minuten ${s} Sekunden`);
  modes.forEach(x=>x.classList.remove("on")); modes[left < 30000 ? 3 : 1].classList.add("on"); }
draw();
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) { const tick = t => { if (last) left = Math.max(0, left - (t - last)); last = t; draw(); if (left > 0) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
</script>
</body>
</html>
